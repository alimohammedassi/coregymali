flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#121310"
  adaptive_icon_foreground: "assets/logo/app_logo.png"
  web:
    generate: true
    image_path: "assets/logo/app_logo.png"
    background_color: "#121310"
    theme_color: "#121310"
  windows:
    generate: true
    image_path: "assets/logo/app_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/app_logo.png"
